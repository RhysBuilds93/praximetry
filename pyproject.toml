[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praximetry"
version = "0.1.0"
description = "Drop-in observability for LLM agents: instrument once, record every call, inspect usage and cost locally."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rhys Francis", email = "rhysfrancis93@gmail.com" }]
keywords = ["llm", "agents", "observability", "tracing", "tokens", "cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
litellm = ["litellm>=1.40"]
gemini = ["google-genai>=0.3"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20"]
langgraph = ["langgraph>=0.2", "langchain-openai>=0.2"]
all = ["openai>=1.30", "anthropic>=0.30", "litellm>=1.40", "google-genai>=0.3",
       "opentelemetry-sdk>=1.20"]
dev = [
    "pytest>=8.0", "httpx>=0.27", "ruff>=0.4,<0.5", "fastapi>=0.110",
    "openai>=1.30", "anthropic>=0.30", "litellm>=1.40", "google-genai>=0.3",
    "opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20",
    "langgraph>=0.2", "langchain-openai>=0.2",
]

[project.scripts]
praximetry = "praximetry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/praximetry"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
